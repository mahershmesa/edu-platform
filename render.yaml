# One-click deploy on Render:
# https://render.com/deploy?repo=https://github.com/mahershmesa/edu-platform
databases:
  - name: asaas-db
    plan: free
    region: frankfurt
    databaseName: asaas
    user: asaas

services:
  - type: web
    name: asaas-academy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # Applies the database schema, creates roles + first admin + demo data (only on an empty DB), then starts.
    startCommand: npm run start:render
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: asaas-db
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        sync: false # Render asks for the admin email during setup
      - key: SEED_ADMIN_PASSWORD
        sync: false # Render asks for the admin password during setup
      - key: CRON_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: ./uploads
